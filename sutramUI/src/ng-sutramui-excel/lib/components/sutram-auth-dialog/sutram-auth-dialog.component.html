<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '92vw', maxWidth: '420px' }"
  styleClass="sutram-auth-dialog"
  [header]="title"
  (onHide)="onDialogHide()">

  <div class="auth-dialog-body">
    <!-- Error Alert Box -->
    <div class="auth-error-box" *ngIf="errorMessage">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Form Fields (Full Width) -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-field">
        <label for="authUsername">Username</label>
        <span class="p-input-icon-left w-full input-full-span">
          <i class="pi pi-user"></i>
          <input
            id="authUsername"
            type="text"
            pInputText
            class="p-inputtext-sm w-full font-mono auth-input"
            [(ngModel)]="username"
            name="username"
            placeholder="e.g. admin or author"
            autofocus
            required />
        </span>
      </div>

      <div class="auth-field">
        <label for="authPassword">Password</label>
        <p-password
          id="authPassword"
          [(ngModel)]="password"
          name="password"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="Password (leave blank if empty)"
          styleClass="w-full auth-password-wrap"
          inputStyleClass="w-full p-inputtext-sm font-mono auth-input">
        </p-password>
      </div>

      <div class="auth-actions">
        <!-- If canDismiss is allowed, simple cancel -->
        <button
          *ngIf="canDismiss"
          pButton
          type="button"
          class="p-button-text p-button-secondary p-button-sm"
          label="Cancel"
          (click)="close()">
        </button>

        <!-- If canDismiss is false, NEVER trap the user: provide clean Escape to Hub -->
        <button
          *ngIf="!canDismiss"
          pButton
          type="button"
          class="p-button-text p-button-secondary p-button-sm"
          icon="pi pi-arrow-left"
          label="Back to Hub"
          (click)="onBackToHubClick()">
        </button>

        <button
          pButton
          type="submit"
          class="p-button-primary p-button-sm auth-submit-btn"
          icon="pi pi-sign-in"
          [loading]="isLoading"
          label="Sign In">
        </button>
      </div>
    </form>

    <!-- Emergency Escape & Reset Link -->
    <div class="auth-footer-emergency">
      <button type="button" class="emergency-link-btn" (click)="onEmergencyResetClick()">
        <i class="pi pi-eraser"></i> Stuck or encountering an issue? <u>Clear Cache & Reset</u>
      </button>
    </div>
  </div>
</p-dialog>
