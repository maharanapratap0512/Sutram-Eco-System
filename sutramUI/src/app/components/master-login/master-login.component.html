<div class="master-login-wrapper">
  <!-- Top Bar with Theme Toggle -->
  <div class="login-top-bar">
    <div class="brand-pill">
      <i class="pi pi-shield"></i>
      <span>Sutram Master Security</span>
    </div>
    <button pButton type="button" class="p-button-sm p-button-rounded p-button-text theme-toggle-btn"
      (click)="toggleTheme.emit()" [icon]="isDarkMode ? 'pi pi-sun' : 'pi pi-moon'"
      [title]="isDarkMode ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
    </button>
  </div>

  <div class="login-card-container">
    <div class="login-card">
      <!-- Brand Header -->
      <div class="login-header">
        <div class="brand-icon-box">
          <i class="pi pi-th-large"></i>
        </div>
        <h1 class="brand-title">सूत्रम् <span>(Sutram) Studio</span></h1>
        <p class="brand-tagline">
          Universal Dynamic Spreadsheet & Database ERP
        </p>
        <span class="auth-gate-badge">Master Workspace Authentication</span>
      </div>

      <!-- Error Alert -->
      <div class="login-error-alert" *ngIf="errorMessage">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" class="login-form">
        <div class="form-field">
          <label class="field-label">यूज़रनेम (Master Username)</label>
          <div class="input-wrapper">
            <i class="pi pi-user input-icon"></i>
            <input type="text" pInputText class="w-full" [(ngModel)]="username" name="username" autocomplete="username"
              placeholder="e.g. admin" [disabled]="isLoading" autofocus />
          </div>
        </div>

        <div class="form-field">
          <label class="field-label">पासवर्ड (Password)</label>
          <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <p-password [(ngModel)]="password" name="password" [feedback]="false" [toggleMask]="true"
              styleClass="w-full" inputStyleClass="w-full" placeholder="••••••••" [disabled]="isLoading">
            </p-password>
          </div>
        </div>

        <!-- Submit Button -->
        <button pButton type="submit" class="p-button-primary w-full login-btn"
          [label]="isLoading ? 'प्रवेश हो रहा है... (Signing In...)' : 'कार्यक्षेत्र में प्रवेश करें (Sign In)'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-sign-in'" [disabled]="isLoading">
        </button>
      </form>

      <!-- Demo Credentials Helper Pill -->
      <div class="demo-credentials-pill" (click)="fillDemoAdmin()" title="Click to autofill default credentials">
        <i class="pi pi-key"></i>
        <span>डिफ़ॉल्ट एडमिन क्रेडेंशियल: <strong>admin / sutram</strong> (क्लिक करके भरें)</span>
      </div>

      <div class="login-footer-hint">
        <i class="pi pi-lock"></i>
        <span>सुरक्षित सत्र (Session is protected with project-level access controls)</span>
      </div>
    </div>
  </div>
</div>
