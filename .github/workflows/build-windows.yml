name: Build Windows Desktop Shell (.exe)

# Triggers ONLY when Tauri Rust shell (src-tauri/) changes, OR manually via "Run workflow" button.
# Regular backend / UI updates use in-app update.zip and do NOT require rebuilding the .exe!
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src-tauri/**'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies (Tauri CLI + Server deps)
        run: npm install --legacy-peer-deps

      - name: Build Angular UI into sutram/dist
        working-directory: sutramUI
        run: |
          npm install --legacy-peer-deps
          npx ng build
        env:
          CI: true
          NG_CLI_ANALYTICS: false

      - name: Build Tauri Windows .exe & Installer
        run: npx tauri build

      - name: Prepare Portable Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-win | Out-Null
          Copy-Item "src-tauri/target/release/sutram-desktop.exe" "release-win/Sutram.exe"
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release-win/" -ErrorAction SilentlyContinue
          }
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release-win/" -ErrorAction SilentlyContinue
          }

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sutram-windows-exe
          path: release-win/
